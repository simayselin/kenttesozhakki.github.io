  <link rel="stylesheet" href="css/styles.css"/>
</head>

<body>

<header class="topbar">
  <div class="container nav">

    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Logo">
      <div>
        <b>İzmir Kent Konseyi</b><br>
        <small>Genç Katılım Platformu</small>
      </div>
    </a>

    <nav class="menu">
      <a href="index.html">Ana Sayfa</a>
      <a href="councils.html">Meclisler</a>
      <a href="groups.html">Çalışma Grupları</a>
      <a href="about.html">Hakkımızda</a>
      <a href="suggestions.html">Öneriler</a>
      <a href="quiz.html">Test</a>

    </nav>

    <div class="nav-cta">
      <a class="btn primary" href="signup.html">Üye ol</a>
    </div>

  </div>
</header>

<main class="page container">

  <section class="pagehead">
    <h1>Giriş</h1>
    <p>Hesabına giriş yaparak öneri paylaşabilir ve katıldığın meclisleri görüntüleyebilirsin.</p>
  </section>

  <section class="card" style="max-width:560px;margin:18px auto 0;padding:22px">

    <form class="form" action="#" method="post">

      <div>
        <label style="display:block; font-weight:800; margin-bottom:8px; opacity:.75">E-posta</label>
        <input class="input" type="email" placeholder="ornek@mail.com" autocomplete="email" required/>
      </div>

      <div>
        <label style="display:block; font-weight:800; margin-bottom:8px; opacity:.75">Şifre</label>
        <input class="input" type="password" placeholder="••••••••" autocomplete="current-password" required/>
      </div>

      <div style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:6px">
        <a class="btn" href="signup.html">Üye ol</a>
        <button class="btn primary" type="submit">Giriş yap</button>
      </div>

      <div style="margin-top:14px; opacity:.7; line-height:1.6; font-weight:600">
        Sosyal medya ile giriş için opsiyonel alan bırakılabilir.
      </div>

    </form>

  </section>

</main>

</body>
</html>
