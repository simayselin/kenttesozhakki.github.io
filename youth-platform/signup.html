<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Üye Ol • Genç Katılım</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>

<body>

<header class="topbar">
  <div class="container nav">

    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Logo">
      <div>
        <b>İzmir Kent Konseyi</b><br>
        <small>Genç Katılım Platformu</small>
      </div>
    </a>

    <nav class="menu">
      <a href="index.html">Ana Sayfa</a>
      <a href="councils.html">Meclisler</a>
      <a href="groups.html">Çalışma Grupları</a>
      <a href="about.html">Hakkımızda</a>
      <a href="suggestions.html">Öneriler</a>
      <a href="quiz.html">Test</a>
      <a class="active" href="signup.html">Üye Ol</a>
    </nav>

    <div class="nav-cta">
      <a class="btn" href="login.html">Giriş</a>
    </div>

  </div>
</header>

<main class="page container">

  <section class="pagehead">
    <h1>Üye Ol</h1>
    <p>Genç Katılım Platformu’na kayıt olarak öneri paylaşabilir ve meclislere katılabilirsin.</p>
  </section>

  <section class="card" style="max-width:620px;margin:18px auto 0;padding:22px">

    <form class="form">

      <div class="grid2">
        <div>
          <label style="font-weight:800;opacity:.75">Ad Soyad</label>
          <input class="input" placeholder="Selin Sapanlı" required>
        </div>

        <div>
          <label style="font-weight:800;opacity:.75">Yaş</label>
          <input class="input" type="number" min="18" max="30" placeholder="18–30" required>
        </div>
      </div>

      <div>
        <label style="font-weight:800;opacity:.75">E-posta</label>
        <input class="input" type="email" placeholder="ornek@mail.com" required>
      </div>

      <div class="grid2">
        <div>
          <label style="font-weight:800;opacity:.75">Telefon</label>
          <input class="input" placeholder="+90 5xx xxx xx xx" required>
        </div>

        <div>
          <label style="font-weight:800;opacity:.75">Doğrulama Kodu</label>
          <input class="input" placeholder="123456">
        </div>
      </div>

      <div>
        <label style="font-weight:800;opacity:.75">Şifre</label>
        <input class="input" type="password" placeholder="••••••••" required>
      </div>

      <div style="margin-top:4px;font-size:13px;opacity:.7;font-weight:600">
        Kayıt olarak KVKK ve kullanım koşullarını kabul etmiş olursun.
      </div>

      <div style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:6px">
        <a class="btn" href="login.html">Giriş</a>
        <a class="btn primary" href="profile.html">Üyeliği tamamla</a>
      </div>

    </form>

  </section>

</main>

</body>
</html>
